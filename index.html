<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huis dashboard</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Huis">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --bg:#FBF8F2; --surface:#FFFFFF; --surface-2:#F4EFE3;
    --border:#E9E2D0; --text:#2C2C2A; --text-2:#6B6963; --text-muted:#9C998F;
    --teal:#0F6E56; --teal-bg:#D2F3EA;
    --coral:#B23E10; --coral-bg:#FFE0D2;
    --purple:#4B3FA0; --purple-bg:#E4DEFF;
    --pink:#9C275A; --pink-bg:#FFDCEC;
    --amber:#8A5A00; --amber-bg:#FFE8B8;
    --red:#B3261E; --red-bg:#FFD9D9;
    --green:#1B7F2E; --green-bg:#DCF5D0;
    --blue:#185FA5; --blue-bg:#DCEBFB;
  }
  [data-theme="dark"]{
    --bg:#2A2724; --surface:#37332F; --surface-2:#433D37;
    --border:#544D45; --text:#F2EEE8; --text-2:#C7BFB5; --text-muted:#978C80;
    --teal:#5FDCB4; --teal-bg:#2E4A3F;
    --coral:#FFA366; --coral-bg:#5A3823;
    --purple:#C2B4FF; --purple-bg:#413A5E;
    --pink:#FF9BC7; --pink-bg:#5A3548;
    --amber:#FFC773; --amber-bg:#5C4726;
    --red:#FF9B8E; --red-bg:#5A332C;
    --green:#A3E08A; --green-bg:#3A4E2E;
    --blue:#8FC1F5; --blue-bg:#2E415A;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); transition:background .2s, color .2s;}
  input,select,button{font-family:inherit; font-size:14px;}
  input[type=text],input[type=number],input[type=date],select{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text);}
  [data-theme="dark"]{ color-scheme: dark; }
  button{cursor:pointer;}
  .hidden{display:none !important;}

  #pinScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; padding:24px; background:linear-gradient(160deg,#FBF8F2,#F4EFE3);}
  #pinScreen .brand{display:flex; align-items:center; gap:8px; font-size:18px; font-weight:500;}
  #pinScreen .brand i{color:var(--teal); font-size:26px;}
  .profiles{display:flex; gap:12px;}
  .profile-btn{padding:14px 22px; border-radius:14px; border:1px solid var(--border); background:var(--surface); font-size:15px; font-weight:500;}
  .profile-btn.active{border-color:var(--teal); background:var(--teal-bg); color:var(--teal);}
  .pin-dots{display:flex; gap:10px; margin:8px 0;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--text-muted);}
  .pin-dot.filled{background:var(--teal); border-color:var(--teal);}
  .keypad{display:grid; grid-template-columns:repeat(3,64px); gap:10px;}
  .key{height:56px; border-radius:14px; border:1px solid var(--border); background:var(--surface); font-size:18px;}
  .key:active{background:var(--surface-2);}
  #pinError{color:var(--red); font-size:13px; height:16px;}

  #app{max-width:1180px; margin:0 auto; padding:16px 16px 90px;}
  header.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  header.topbar h1{font-size:19px; font-weight:500; margin:0; display:flex; align-items:center; gap:8px;}
  header.topbar h1 i{color:var(--teal); font-size:22px;}
  header.topbar .who{font-size:13px; color:var(--text-2);}

  nav.bottomnav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:10;}
  nav.bottomnav .navitem{display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--text-muted); background:none; border:none; padding:6px 4px; flex:1; max-width:100px; border-radius:8px;}
  nav.bottomnav .navitem i{font-size:20px;}
  nav.bottomnav .navitem span{font-size:10px;}
  nav.bottomnav .navitem.active{color:var(--teal);}
  nav.bottomnav .navitem.soon{opacity:.45;}

  nav.topnav{display:none;}

  @media(min-width:900px){
    nav.bottomnav{display:none;}
    nav.topnav{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;}
    nav.topnav .navitem{display:flex; align-items:center; gap:6px; color:var(--text-2); background:none; border:none; padding:8px 14px; border-radius:10px; font-size:14px; font-weight:500;}
    nav.topnav .navitem i{font-size:17px;}
    nav.topnav .navitem.active{color:var(--teal); background:var(--teal-bg);}
    nav.topnav .navitem.soon{opacity:.45;}
    #app{padding-bottom:32px;}
  }

  .page{display:none;}
  .page.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .card-header{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .card-header .icon-badge{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .card-header .section-title{font-size:15px; font-weight:500; margin:0;}
  .dash-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:900px){ .dash-grid{grid-template-columns:1.3fr 1fr;} }

  .task-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; background:var(--surface-2); margin-bottom:6px; border-left:4px solid transparent;}
  .task-row .icon{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;}
  .task-row span.label{flex:1; font-size:13px;}

  .warn-row{display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:9px; margin-bottom:6px; font-size:13px; font-weight:500; border-left:4px solid transparent;}

  .agenda-week{display:grid; grid-template-columns:repeat(9,1fr); gap:6px; overflow-x:auto; overflow-y:visible; padding-top:4px;}
  @media(max-width:1099px){ .agenda-week{grid-template-columns:repeat(9,90px);} }
  .agenda-day{border-radius:10px; padding:8px; min-height:100px; background:var(--surface-2); border:2px solid transparent;}
  .agenda-day.weekend{background:var(--pink-bg);}
  .agenda-day.today{border-color:var(--teal); background:var(--teal-bg);}
  .agenda-day .daylabel{font-size:11px; font-weight:500; color:var(--text-2); margin-bottom:6px; display:flex; flex-direction:column;}
  .agenda-day .daylabel .dagnaam{font-weight:500;}
  .agenda-day .daylabel .datum{font-size:10px; color:var(--text-muted);}
  .agenda-day.weekend .daylabel{color:var(--pink);}
  .agenda-day.today .daylabel{color:var(--teal);}
  .agenda-day.today .daylabel .datum{color:var(--teal);}
  .agenda-item{font-size:11px; background:var(--surface); border-radius:6px; padding:5px 6px; margin-bottom:4px;}
  @media(max-width:899px){
    .agenda-week{grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:88px; gap:6px; overflow-x:auto; overflow-y:visible; padding-top:4px; padding-bottom:4px; padding-left:calc(50% - 44px); padding-right:calc(50% - 44px); scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
    .agenda-day{min-height:78px; padding:7px 5px; scroll-snap-align:center;}
    .agenda-day .daylabel{font-size:12px;}
    .agenda-day .daylabel .datum{font-size:11px;}
    .agenda-item{font-size:10.5px; padding:3px 4px;}
  }

  .toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
  .toolbar select{width:auto; min-width:140px;}
  .chip{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:500; display:inline-flex; align-items:center; gap:4px; user-select:none; -webkit-user-select:none;}
  .status-badge{font-size:11px; padding:4px 10px; border-radius:999px; font-weight:500; white-space:nowrap;}

  .taak-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--border); margin-bottom:8px; border-left:5px solid transparent;}
  @media(max-width:899px){
    .taak-item{padding:7px 10px; margin-bottom:6px; gap:8px;}
    .taak-item .info .naam{font-size:13px;}
    .taak-item .info .meta{font-size:11px;}
    .taak-item .cat-icon{width:26px; height:26px; font-size:13px;}
  }
  .taak-item .cat-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .taak-item .info{flex:1; min-width:0;}
  .taak-item .info .naam{font-size:14px; font-weight:500;}
  .taak-item .info .meta{font-size:12px; color:var(--text-muted);}

  .add-btn{display:flex; align-items:center; gap:6px; background:var(--teal); color:white; border:none; padding:9px 14px; border-radius:9px; font-size:13px; font-weight:500;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:20; padding:16px;}
  .modal{background:var(--surface); border-radius:16px; padding:20px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px;}
  .modal h3{margin:0 0 4px; font-size:16px; font-weight:500;}
  .modal label{font-size:12px; color:var(--text-2); margin-bottom:-4px;}
  .modal-actions{display:flex; gap:8px; margin-top:8px;}
  .modal-actions button{flex:1; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:13px;}
  .modal-actions button.primary{background:var(--teal); color:white; border:none;}

  .soon-page{text-align:center; padding:60px 20px; color:var(--text-2);}
  .soon-page i{font-size:32px; color:var(--text-muted); margin-bottom:10px; display:block;}

  .ctxmenu{position:fixed; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:30; padding:6px; min-width:200px;}
  .ctxmenu button{display:flex; align-items:center; gap:8px; width:100%; background:none; border:none; text-align:left; padding:8px 10px; border-radius:7px; font-size:13px;}
  .ctxmenu button:hover{background:var(--surface-2);}
  .ctxmenu .datepick{display:flex; gap:6px; padding:6px; align-items:center;}

  .boodschap-group{margin-bottom:10px;}
  .boodschap-group .catlabel{font-size:11px; font-weight:500; color:var(--text-muted); margin-bottom:4px;}
  .boodschap-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;}

  .link-chip{display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:10px; background:var(--surface-2); font-size:13px; font-weight:500; text-decoration:none; color:var(--text);}
  .link-chip i{font-size:16px; color:var(--purple);}

  .onbekend-banner{display:flex; align-items:center; gap:10px; background:var(--purple-bg); color:var(--purple); border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:13px; font-weight:500; cursor:pointer; border:none; width:100%; text-align:left;}
  .onbekend-banner i:first-child{font-size:18px;}

  .fab-wrap{display:flex; justify-content:center; margin-top:10px;}
  .fab{display:flex; align-items:center; gap:6px; padding:9px 17px; border-radius:999px; border:1.5px solid currentColor; font-size:13px; font-weight:600; background:var(--surface-2); color:var(--text-2);}
  .fab i{font-size:15px;}
  .fab:active{transform:scale(.97);}
</style>
</head>
<body>

<div id="pinScreen">
  <div class="brand"><i class="ti ti-home-2"></i>Huis dashboard</div>
  <div class="profiles" id="profileChoice">
    <button class="profile-btn active" data-profile="Emiel">Emiel</button>
    <button class="profile-btn" data-profile="Veerle">Veerle</button>
  </div>
  <div class="pin-dots" id="pinDots"></div>
  <div id="pinError"></div>
  <div class="keypad" id="keypad"></div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1><i class="ti ti-home-2"></i>Huis dashboard</h1>
    <button id="btnThema" class="fab" style="background:var(--surface-2); color:var(--text-2); margin-left:auto; margin-right:12px; font-size:13px;">🌙 Donker</button>
    <span class="who" id="whoLabel" style="cursor:pointer;" title="Tik om uit te loggen"></span>
  </header>

  <nav class="topnav" id="topnav"></nav>

  <section id="page-dashboard" class="page active">
    <div id="onbekendBanner"></div>
    <div id="agendaWidgetSlotHome"></div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-header"><span class="icon-badge" style="background:var(--pink-bg); color:var(--pink);"><i class="ti ti-star"></i></span><p class="section-title">Dit weekend</p></div>
      <div id="dashWeekend"></div>
      <div class="fab-wrap"><button class="fab" style="background:var(--surface-2); color:var(--text-2);" onclick="weekendAfsluiten()"><i class="ti ti-flag-check"></i>Weekend afsluiten</button></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="icon-badge" style="background:var(--green-bg); color:var(--green);"><i class="ti ti-shopping-cart"></i></span><p class="section-title">Boodschappen (supermarkt)</p></div>
      <div id="dashBoodschappen"></div>
      <div class="fab-wrap"><button class="fab" id="btnNieuwBoodschap" style="background:var(--green-bg); color:var(--green);" aria-label="Boodschap toevoegen"><span style="font-weight:800; font-size:15px;">+</span>Boodschap toevoegen</button></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header"><span class="icon-badge" style="background:var(--purple-bg); color:var(--purple);"><i class="ti ti-external-link"></i></span><p class="section-title">Snelkoppelingen</p><button class="fab" style="margin-left:auto; background:var(--purple-bg); color:var(--purple);" id="btnNieuweLink"><span style="font-weight:800; font-size:15px;">+</span>Toevoegen</button></div>
      <div id="dashLinks" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>
  </section>

  <section id="page-agenda" class="page">
    <div class="card-header" style="margin-bottom:16px;"><span class="icon-badge" style="width:38px; height:38px; font-size:19px; background:var(--pink-bg); color:var(--pink);"><i class="ti ti-calendar"></i></span><h2 style="font-size:19px; font-weight:500; margin:0;">Agenda</h2></div>

    <div class="toolbar" style="margin-bottom:16px;">
      <button class="navitem active" data-sub="week" style="border-radius:10px; background:var(--teal-bg); color:var(--teal); padding:8px 16px; border:2px solid var(--teal);">Week</button>
      <button class="navitem" data-sub="maand" style="border-radius:10px; padding:8px 16px; color:var(--text-2); background:none; border:2px solid transparent;">Maand</button>
      <button class="navitem" data-sub="vakantie" style="border-radius:10px; padding:8px 16px; color:var(--text-2); background:none; border:2px solid transparent;">Vakantie</button>
    </div>

    <div id="agendaSub-week" class="subpage">
      <div id="agendaWidgetSlotAgenda"></div>
      <div id="agendaWidgetCard" class="card" style="margin-bottom:16px;">
        <div class="card-header"><span class="icon-badge" style="background:var(--pink-bg); color:var(--pink);"><i class="ti ti-calendar-week"></i></span><p class="section-title">Deze week</p>
          <div style="margin-left:auto; position:relative;">
            <button class="fab" id="btnAgendaKiezer" style="background:var(--surface-2); color:var(--text-2); padding:6px 12px; font-size:12px;"><i class="ti ti-adjustments"></i>Agenda's</button>
            <div id="selectGoogleAgenda" class="hidden" style="position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:6px; z-index:15; min-width:200px; box-shadow:0 6px 20px rgba(0,0,0,.1);"></div>
          </div>
          <button class="fab" id="btnGoogleVerbinden" style="background:var(--surface-2); color:var(--text-2); padding:6px 12px; font-size:12px;"><i class="ti ti-brand-google"></i>Google Agenda verbinden</button>
        </div>
        <div style="display:flex; align-items:stretch; gap:6px;">
          <button style="border:none; background:var(--surface-2); color:var(--text-2); border-radius:10px; width:28px; font-size:18px; flex-shrink:0;" onclick="veranderWeek(-1)" aria-label="Vorige week">‹</button>
          <div class="agenda-week" id="agendaWeek" style="flex:1;"></div>
          <button style="border:none; background:var(--surface-2); color:var(--text-2); border-radius:10px; width:28px; font-size:18px; flex-shrink:0;" onclick="veranderWeek(1)" aria-label="Volgende week">›</button>
        </div>
        <div style="display:flex; align-items:center; justify-content:center; margin-top:10px;">
          <button class="fab" style="background:var(--surface-2); color:var(--text-2); padding:6px 12px; font-size:12px;" id="weekLabel" onclick="gaNaarDezeWeek()"></button>
        </div>
        <div class="fab-wrap"><button class="fab" id="btnNieuweAgendaItem" style="background:var(--pink-bg); color:var(--pink);" aria-label="Agenda-item toevoegen"><span style="font-weight:800; font-size:15px;">+</span>Agenda-item toevoegen</button></div>
      </div>
    </div>

    <div id="agendaSub-maand" class="subpage hidden">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px;">
          <button style="border:none; background:var(--surface-2); color:var(--text-2); border-radius:10px; width:32px; height:32px;" onclick="veranderMaand(-1)">‹</button>
          <span id="maandLabel" style="font-size:15px; font-weight:500; min-width:140px; text-align:center;"></span>
          <button style="border:none; background:var(--surface-2); color:var(--text-2); border-radius:10px; width:32px; height:32px;" onclick="veranderMaand(1)">›</button>
        </div>
        <div id="maandGrid"></div>
      </div>
    </div>

    <div id="agendaSub-vakantie" class="subpage hidden">
      <div class="card" style="margin-bottom:16px;">
        <div class="card-header"><span class="icon-badge" style="background:var(--amber-bg); color:var(--amber);"><i class="ti ti-suitcase"></i></span><p class="section-title">Vakanties</p></div>
        <div id="vakantieLijst"></div>
        <div class="fab-wrap"><button class="fab" style="background:var(--amber-bg); color:var(--amber);" id="btnNieuweVakantie"><span style="font-weight:800; font-size:15px;">+</span>Nieuwe vakantie</button></div>
      </div>
      <div id="vakantiePlanner"></div>
    </div>
  </section>

  <section id="page-onderhoud" class="page">
    <div class="card-header" style="margin-bottom:16px;"><span class="icon-badge" style="width:38px; height:38px; font-size:19px; background:var(--teal-bg); color:var(--teal);"><i class="ti ti-tool"></i></span><h2 style="font-size:19px; font-weight:500; margin:0;">Onderhoud</h2></div>
    <div class="toolbar">
      <div style="position:relative; flex:1; min-width:160px;">
        <i class="ti ti-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--text-muted);"></i>
        <input type="text" id="zoekOnderhoud" placeholder="Zoek een taak" style="padding-left:32px;">
      </div>
      <select id="filterCategorie"></select>
      <select id="sorteerOnderhoud">
        <option value="status">Groepeer op status</option>
        <option value="locatie">Groepeer op locatie</option>
        <option value="naam">Alfabetisch (A-Z)</option>
      </select>
      <button class="fab" style="background:var(--teal-bg); color:var(--teal);" id="btnNieuweTaakOnderhoudTop"><span style="font-weight:800; font-size:15px;">+</span>Toevoegen</button>
    </div>
    <div id="onderhoudLijst"></div>
    <div class="fab-wrap"><button class="fab" id="btnNieuweTaakOnderhoud" style="background:var(--teal-bg); color:var(--teal);" aria-label="Nieuwe onderhoudstaak"><span style="font-weight:800; font-size:15px;">+</span>Nieuwe taak</button></div>
  </section>

  <section id="page-klussen" class="page">
    <div class="card-header" style="margin-bottom:16px;"><span class="icon-badge" style="width:38px; height:38px; font-size:19px; background:var(--blue-bg); color:var(--blue);"><i class="ti ti-list-check"></i></span><h2 style="font-size:19px; font-weight:500; margin:0;">Klussen</h2></div>
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header"><span class="icon-badge" style="background:var(--blue-bg); color:var(--blue);"><i class="ti ti-inbox"></i></span><p class="section-title">Backlog (nog niet gepland)</p></div>
      <div id="klussenBacklog"></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="icon-badge" style="background:var(--green-bg); color:var(--green);"><i class="ti ti-calendar-event"></i></span><p class="section-title">Ingepland</p></div>
      <div id="klussenGepland"></div>
    </div>
    <div class="fab-wrap"><button class="fab" id="btnNieuweTaakKlus" style="background:var(--blue-bg); color:var(--blue);" aria-label="Nieuwe klus"><span style="font-weight:800; font-size:15px;">+</span>Nieuwe klus</button></div>
  </section>

  <section id="page-spullen" class="page">

function lokaleDatumString(d){

}

function berekenStatus(taak){
  if(taak.frequentie === "Onbekend"){
    return {status:"onbekend"};
  }
  if(taak.frequentie === "Eenmalig"){
    if(taak.voltooid) return {status:"voltooid"};
    if(taak.geplandOp){
      const gepland = new Date(taak.geplandOp);
      return {status: gepland < new Date(new Date().toDateString()) ? "te laat" : "gepland"};
    }
    return {status:"niet gepland"};
  }
  const regel = FREQ_REGELS[taak.frequentie] || FREQ_REGELS["Maandelijks"];
  const laatst = new Date(taak.laatstGedaan);
  const volgende = new Date(laatst.getTime() + regel.interval*86400000);
  const waarschuwing = new Date(volgende.getTime() - regel.waarschuwing*86400000);
  const vandaag = new Date();
  let status = "op schema";
  if(vandaag > volgende) status = "te laat";
  else if(vandaag >= waarschuwing) status = "binnenkort";
  return {status, volgende};
}

  "op schema": {bg:"var(--green-bg)", fg:"var(--green)", label:"Op schema", icon:"ti-check"},
  "onbekend": {bg:"var(--purple-bg)", fg:"var(--purple)", label:"Onbekend", icon:"ti-help"},
  "voltooid": {bg:"var(--green-bg)", fg:"var(--green)", label:"Voltooid", icon:"ti-check"},
  "gepland": {bg:"var(--blue-bg)", fg:"var(--blue)", label:"Gepland", icon:"ti-calendar-event"},
  "niet gepland": {bg:"var(--surface-2)", fg:"var(--text-muted)", label:"Nog niet gepland", icon:"ti-minus"}
};

const STATUS_GROEPEN = [
  {status:"te laat", label:"Te laat", icon:"ti-alert-triangle", bg:"var(--red-bg)", fg:"var(--red)"},
  {status:"binnenkort", label:"Binnenkort", icon:"ti-clock", bg:"var(--amber-bg)", fg:"var(--amber)"},

function renderOnderhoud(){
  const filterCat = document.getElementById("filterCategorie").value;
  const zoekterm = (document.getElementById("zoekOnderhoud").value || "").toLowerCase().trim();
  const sorteer = document.getElementById("sorteerOnderhoud").value;
  let alles = taken.filter(t=>t.frequentie !== "Eenmalig").filter(t=>!filterCat || t.categorie===filterCat);
  if(zoekterm) alles = alles.filter(t=>t.naam.toLowerCase().includes(zoekterm));

  let html = "";
  if(sorteer === "naam"){
    const lijst = [...alles].sort((a,b)=>a.naam.localeCompare(b.naam));
    html = `<div class="card"><div class="sleeplijst-uit" data-status="__alle__">${lijst.length ? lijst.map(t=>renderTaakRij(t)).join('') : `<p style="color:var(--text-muted); font-size:13px; margin:0;">Niets gevonden.</p>`}</div></div>`;
  } else if(sorteer === "locatie"){
    const perLocatie = {};
    alles.forEach(t=>{ (perLocatie[t.categorie] = perLocatie[t.categorie]||[]).push(t); });
    html = Object.keys(perLocatie).sort((a,b)=>a.localeCompare(b)).map(cat=>{
      const info = catInfo(cat);
      const lijst = perLocatie[cat].sort((a,b)=>a.naam.localeCompare(b.naam));
      return `
        <div class="card" style="margin-bottom:14px;">
          <div class="card-header"><span class="icon-badge" style="background:${info.bg}; color:${info.fg};"><i class="ti ${info.icon}"></i></span><p class="section-title">${cat}</p><span style="margin-left:auto; font-size:12px; color:var(--text-muted);">${lijst.length}</span></div>
          <div class="sleeplijst-uit" data-status="${cat}">${lijst.map(t=>renderTaakRij(t)).join('')}</div>
        </div>`;
    }).join('');
  } else {
    html = STATUS_GROEPEN.map(g=>{
      const lijst = alles.filter(t=>berekenStatus(t).status === g.status).sort((a,b)=>(a.volgorde||0)-(b.volgorde||0));
      return `
        <div class="card" style="margin-bottom:14px;">
          <div class="card-header"><span class="icon-badge" style="background:${g.bg}; color:${g.fg};"><i class="ti ${g.icon}"></i></span><p class="section-title">${g.label}</p><span style="margin-left:auto; font-size:12px; color:var(--text-muted);">${lijst.length}</span></div>
          <div class="sleeplijst" data-status="${g.status}">
            ${lijst.length ? lijst.map(t=>renderTaakRij(t)).join('') : `<p style="color:var(--text-muted); font-size:13px; margin:0;">Niets hier.</p>`}
          </div>
        </div>`;
    }).join('');
  }
  document.getElementById("onderhoudLijst").innerHTML = html;

  document.querySelectorAll("#onderhoudLijst .sleeplijst, #onderhoudLijst .sleeplijst-uit").forEach(el=>{
    new Sortable(el, {animation:150, forceFallback:true, handle:".sleep-handle", onEnd:async ()=>{
      const ids = [...el.querySelectorAll("[data-taak-id]")].map(x=>x.dataset.taakId);
      ids.forEach((id,i)=>{ const t = taken.find(t=>t.id===id); if(t) t.volgorde = i; });
      await Promise.all(ids.map((id,i)=> db.from('taken').update({volgorde:i}).eq('id', id)));
    }});
  });
  renderDashboard();
}

async function laadGoogleAgendaLijst(){
  try{
    const res = await fetch("https://www.googleapis.com/calendar/v3/users/me/calendarList", {headers:{Authorization:`Bearer ${googleToken}`}});
    const data = await res.json();

    geselecteerdeAgendaIds = [samenAgenda?.id, eigenAgenda?.id].filter(Boolean);

  }catch(e){ toonDebugFout({message:"Agenda's ophalen mislukt: "+e.message}); }

async function haalGoogleAgendaOp(){
  if(!googleToken || kolomDatumsHuidig.length === 0 || geselecteerdeAgendaIds.length === 0) return;
  const eersteDag = kolomDatumsHuidig[0];
  const laatsteDagPlusEen = new Date(kolomDatumsHuidig[kolomDatumsHuidig.length-1]); laatsteDagPlusEen.setDate(laatsteDagPlusEen.getDate()+1);
  const timeMin = eersteDag.toISOString();
  const timeMax = laatsteDagPlusEen.toISOString();
  try{
    const resultaten = await Promise.all(geselecteerdeAgendaIds.map(async (agendaId)=>{
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(agendaId)}/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
      const res = await fetch(url, {headers:{Authorization:`Bearer ${googleToken}`}});
      const data = await res.json();
      if(data.error){ toonDebugFout({message:`Google Agenda (${agendaId}) status ${res.status}: ` + data.error.message}); return []; }
      const kleur = googleAgendaLijst.find(c=>c.id===agendaId)?.backgroundColor || "var(--pink)";
      const items = (data.items||[]).map(ev=>{
        const basis = {tekst: ev.summary || "(zonder titel)", kleur, id: ev.id, agendaId, link: ev.htmlLink};
        if(ev.start.dateTime){
          const d = new Date(ev.start.dateTime);
          return {...basis, datum: lokaleDatumString(d), tijd: String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')};
        }
        return {...basis, datum: ev.start.date, tijd: null};
      });
      return items;
    }));
    agendaNotities = resultaten.flat();
    renderAgendaWeek();
  }catch(e){ toonDebugFout({message:"Google Agenda ophalen mislukt: "+e.message}); }
}
async function voegGoogleAgendaItemToeAan(tekst, datum, agendaId){
  if(!googleToken) return false;
  try{
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(agendaId)}/events`, {
      method:"POST",
      headers:{Authorization:`Bearer ${googleToken}`, "Content-Type":"application/json"},
      body: JSON.stringify({summary: tekst, start:{date:datum}, end:{date:datum}})
    });
    const data = await res.json();
    if(data.error){ toonDebugFout({message:"Toevoegen aan Google Agenda mislukt: "+data.error.message}); return false; }
    return true;
  }catch(e){ toonDebugFout({message:"Toevoegen aan Google Agenda mislukt: "+e.message}); return false; }
}

function renderAgendaWeek(){
  const DAGNAMEN = ["zo","ma","di","wo","do","vr","za"];
  const vandaag = new Date(); vandaag.setHours(0,0,0,0);
  const dagVanWeek = vandaag.getDay();
  const maandag = new Date(vandaag); maandag.setDate(vandaag.getDate() - ((dagVanWeek+6)%7) + weekOffset*7);
  const zaterdagErvoor = new Date(maandag); zaterdagErvoor.setDate(maandag.getDate()-2);
  const kolomDatums = [];
  for(let i=0;i<9;i++){ const d = new Date(zaterdagErvoor); d.setDate(zaterdagErvoor.getDate()+i); kolomDatums.push(d); }
  kolomDatumsHuidig = kolomDatums;
  const vrijdag = new Date(maandag); vrijdag.setDate(maandag.getDate()+4);
  document.getElementById("weekLabel").textContent = weekOffset === 0
    ? `${maandag.getDate()} ${MAANDEN_KORT[maandag.getMonth()]} - ${vrijdag.getDate()} ${MAANDEN_KORT[vrijdag.getMonth()]}`
    : "Deze week";
  document.getElementById("agendaWeek").innerHTML = kolomDatums.map((d)=>{
    const isWeekend = d.getDay()===0 || d.getDay()===6;
    const isVandaag = d.getTime()===vandaag.getTime();
    const iso = lokaleDatumString(d);
    const items = agendaNotities.map((n,i)=>({...n,_i:i})).filter(n=>n.datum===iso);
    return `
    <div class="agenda-day ${isWeekend?'weekend':''} ${isVandaag?'today':''}">
      <div class="daylabel"><span class="dagnaam">${DAGNAMEN[d.getDay()]}</span><span class="datum">${d.getDate()} ${MAANDEN_KORT[d.getMonth()]}</span></div>
      ${items.length ? items.map(x=>`<div class="agenda-item" title="${x.tijd?x.tijd+' - ':''}${x.tekst}" onclick="toonAgendaMenu(event,${x._i})"><span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:${x.kleur||'var(--pink)'}; margin-right:4px;"></span>${x.tekst}</div>`).join('') : '<div style="font-size:11px; color:var(--text-muted);">-</div>'}
    </div>`;
  }).join('');
  const vandaagEl = document.querySelector("#agendaWeek .agenda-day.today");
  const agendaContainer = document.getElementById("agendaWeek");
  if(vandaagEl && weekOffset === 0){
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      const doel = vandaagEl.offsetLeft - (agendaContainer.clientWidth/2) + (vandaagEl.clientWidth/2);
      agendaContainer.scrollLeft = doel;
    }));
  } else {
    agendaContainer.scrollLeft = 0;
  }
}

function isoWeekNummer(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const eersteDonderdag = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const verschil = date - eersteDonderdag;
  return 1 + Math.round(verschil / (7*24*3600*1000));
}
let maandOffset = 0;
const MAAND_NAMEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
function veranderMaand(delta){ maandOffset += delta; renderMaand(); }
async function renderMaand(){
  const vandaag = new Date(); vandaag.setHours(0,0,0,0);
  const basis = new Date(vandaag.getFullYear(), vandaag.getMonth()+maandOffset, 1);
  document.getElementById('maandLabel').textContent = `${MAAND_NAMEN[basis.getMonth()]} ${basis.getFullYear()}`;
  const eersteDagWeek = (basis.getDay()+6)%7;
  const startGrid = new Date(basis); startGrid.setDate(basis.getDate() - eersteDagWeek);
  const dagenInMaand = new Date(basis.getFullYear(), basis.getMonth()+1, 0).getDate();
  const totaalCellen = Math.ceil((eersteDagWeek + dagenInMaand) / 7) * 7;

  let itemsPerDag = {};
  if(googleToken && geselecteerdeAgendaIds.length){
    const eindGrid = new Date(startGrid); eindGrid.setDate(startGrid.getDate() + totaalCellen);
    try{
      const resultaten = await Promise.all(geselecteerdeAgendaIds.map(async (agendaId)=>{
        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(agendaId)}/events?timeMin=${encodeURIComponent(startGrid.toISOString())}&timeMax=${encodeURIComponent(eindGrid.toISOString())}&singleEvents=true&orderBy=startTime`;
        const res = await fetch(url, {headers:{Authorization:`Bearer ${googleToken}`}});
        const data = await res.json();
        if(data.error) return [];
        return (data.items||[]).map(ev=>({
          tekst: ev.summary || "(zonder titel)",
          datum: ev.start.dateTime ? lokaleDatumString(new Date(ev.start.dateTime)) : ev.start.date
        }));
      }));
      resultaten.flat().forEach(i=>{ (itemsPerDag[i.datum] = itemsPerDag[i.datum]||[]).push(i.tekst); });
    }catch(e){ /* stil falen, maandoverzicht blijft dan leeg */ }
  }

  let html = `<div style="display:grid; grid-template-columns:28px repeat(7,1fr); gap:4px; font-size:11px; color:var(--text-muted); margin-bottom:6px;">
    <span></span><span>ma</span><span>di</span><span>wo</span><span>do</span><span>vr</span><span>za</span><span>zo</span>
  </div>`;
  for(let w=0; w<totaalCellen/7; w++){
    const weekStart = new Date(startGrid); weekStart.setDate(startGrid.getDate()+w*7);
    html += `<div style="display:grid; grid-template-columns:28px repeat(7,1fr); gap:4px; margin-bottom:4px;">`;
    html += `<span style="font-size:10px; color:var(--text-muted); align-self:start; padding-top:4px;">${isoWeekNummer(weekStart)}</span>`;
    for(let d=0; d<7; d++){
      const dag = new Date(weekStart); dag.setDate(weekStart.getDate()+d);
      const inMaand = dag.getMonth()===basis.getMonth();
      const isVandaag = dag.getTime()===vandaag.getTime();
      const iso = lokaleDatumString(dag);
      const items = itemsPerDag[iso] || [];
      html += `<div style="height:78px; overflow:hidden; border-radius:8px; background:${isVandaag?'var(--teal-bg)':'var(--surface-2)'}; border:1px solid var(--border); padding:4px; opacity:${inMaand?1:.4};">
        <div style="font-size:11px; font-weight:${isVandaag?'700':'500'}; color:${isVandaag?'var(--teal)':'var(--text)'};">${dag.getDate()}</div>
        ${items.slice(0,2).map(t=>`<div style="font-size:9px; background:var(--surface); border-radius:4px; padding:1px 3px; margin-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">${t}</div>`).join('')}
        ${items.length>2 ? `<div style="font-size:9px; color:var(--text-muted); margin-top:1px;">+${items.length-2}</div>` : ''}
      </div>`;
    }
    html += `</div>`;
  }
  document.getElementById('maandGrid').innerHTML = html;
}

window.zoekVakantieInAgenda = async function(){
  if(!googleToken){ document.getElementById('modalError').textContent = "Verbind eerst met Google Agenda (tabblad Week)."; return; }
  const naam = document.getElementById('nieuweVakantieNaam').value.trim().toLowerCase();
  const zoekterm = naam || "vakantie";
  const nu = new Date();
  const overEenJaar = new Date(); overEenJaar.setFullYear(nu.getFullYear()+1);
  document.getElementById('modalError').textContent = "Zoeken...";
  try{
    const resultaten = await Promise.all(geselecteerdeAgendaIds.map(async (agendaId)=>{
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(agendaId)}/events?timeMin=${encodeURIComponent(nu.toISOString())}&timeMax=${encodeURIComponent(overEenJaar.toISOString())}&singleEvents=true&orderBy=startTime&q=${encodeURIComponent(zoekterm)}`;
      const res = await fetch(url, {headers:{Authorization:`Bearer ${googleToken}`}});
      const data = await res.json();
      return data.items || [];
    }));
    const gevonden = resultaten.flat().sort((a,b)=> new Date(a.start.date||a.start.dateTime) - new Date(b.start.date||b.start.dateTime))[0];
    if(!gevonden){ document.getElementById('modalError').textContent = "Niets gevonden in je agenda."; return; }
    const startDatum = gevonden.start.date || gevonden.start.dateTime.slice(0,10);
    let eindDatum = gevonden.end.date || gevonden.end.dateTime.slice(0,10);
    if(gevonden.end.date){ const e = new Date(eindDatum); e.setDate(e.getDate()-1); eindDatum = lokaleDatumString(e); }
    document.getElementById('nieuweVakantieStart').value = startDatum;
    document.getElementById('nieuweVakantieEind').value = eindDatum;
    if(!naam) document.getElementById('nieuweVakantieNaam').value = gevonden.summary || "";
    document.getElementById('modalError').textContent = `Gevonden: "${gevonden.summary}"`;
  }catch(e){ document.getElementById('modalError').textContent = "Zoeken mislukt."; }
};

        const tekst = el.dataset.tekst;
        const oudKruisje = el.querySelector('.verwijder-suggestie-item');
        if(oudKruisje) oudKruisje.remove();
        const {data:nieuw, error:fout} = await db.from('vakantie_items').insert({vakantie_id: huidigeVakantieId, datum, tekst, volgorde:0}).select().single();
        if(fout){ toonDebugFout(fout); return; }
        el.dataset.id = nieuw.id;
        el.removeAttribute('data-tekst');
        el.removeAttribute('data-suggestie-id');
        const x = document.createElement('span');
        x.textContent=' ✕';
        x.className='verwijder-vakantie-item';
        x.style.cssText='cursor:pointer; margin-left:6px; color:var(--red);';
        x.onclick = (e)=>verwijderVakantieItem(e, nieuw.id);
        el.appendChild(x);
      } else {
        await db.from('vakantie_items').update({datum}).eq('id', el.dataset.id);
      }
    }}));
  });
}
window.verwijderVakantieItem = async function(e, id){
  e.stopPropagation();
  e.preventDefault();
  const {error} = await db.from('vakantie_items').delete().eq('id', id);
  if(error){ toonDebugFout(error); return; }
  vakantieItems = vakantieItems.filter(i=>i.id!==id);
  const el = document.querySelector(`.vakantie-dropzone [data-id="${id}"]`);
  if(el) el.remove();
};
window.verwijderSuggestie = async function(e, id){
  e.stopPropagation();
  await db.from('activiteit_suggesties').delete().eq('id', id);
  activiteitSuggesties = activiteitSuggesties.filter(s=>s.id!==id);
  renderVakantiePlanner();
};
window.voegBankActiviteitToe = async function(){
  const input = document.getElementById('nieuweActiviteitInput');
  const tekst = input.value.trim();
  if(!tekst) return;
  const {data, error} = await db.from('activiteit_suggesties').insert({tekst}).select().single();
  if(error){ toonDebugFout(error); return; }
  activiteitSuggesties.push(data);
  renderVakantiePlanner();
};
window.zetVakantieInAgenda = async function(){
  if(!googleToken){ toonDebugFout({message:"Verbind eerst met Google Agenda (tabblad Week) voordat je dit kunt gebruiken."}); return; }
  const nogNietGesynct = vakantieItems.filter(i=>!i.google_event_id);
  if(nogNietGesynct.length === 0) return;
  for(const item of nogNietGesynct){
    try{
      const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(toeVoegenAgendaId)}/events`, {
        method:"POST",
        headers:{Authorization:`Bearer ${googleToken}`, "Content-Type":"application/json"},
        body: JSON.stringify({summary: item.tekst, start:{date:item.datum}, end:{date:item.datum}})
      });
      const data = await res.json();
      if(data.id){ await db.from('vakantie_items').update({google_event_id:data.id}).eq('id', item.id); }
    }catch(e){ /* deze mislukte, ga door met de rest */ }
  }
  renderVakantiePlanner();
};

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/service-worker.js");
}
init();
</script>
